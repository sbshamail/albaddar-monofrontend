name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect which app(s) changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # shared/ is depended on by both apps (see AGENTS.md) — a change
          # there has to build/deploy both, it can't be scoped to just one.
          # Root config (package.json, pnpm-lock.yaml, ecosystem.config.js,
          # this workflow) also affects both, for the same reason.
          filters: |
            admin:
              - 'admin/**'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'ecosystem.config.js'
              - '.github/workflows/ci-cd.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'ecosystem.config.js'
              - '.github/workflows/ci-cd.yml'

  build-check:
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # Root install — npm/pnpm workspaces hoist to one root node_modules,
        # never install from inside admin/ or frontend/ individually (see
        # AGENTS.md).
        run: pnpm install --frozen-lockfile

      # `next-env.d.ts` is gitignored by default (Next.js's own convention)
      # and is what carries the `next/image-types/global` reference that
      # makes `import x from "*.png"` etc. resolve as a typed module — it
      # only gets (re)generated by a Next CLI command. `next build` would
      # generate it as a side effect, but this job deliberately skips that
      # (see below); `next typegen` is the lightweight equivalent — routes/
      # pages/layout types only, no backend connectivity needed — so a fresh
      # CI checkout (which never has this file) can still type-check any
      # static asset import. Missing this step is exactly what broke a
      # prior CI run with "Cannot find module '...buyagain-logo.webp'"
      # despite `tsc` passing clean locally, where the file already existed
      # from an earlier local `next dev`/`next build`.
      - name: Generate Next types (admin)
        if: needs.changes.outputs.admin == 'true'
        run: pnpm --filter admin exec next typegen

      - name: Generate Next types (frontend)
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter frontend exec next typegen

      - name: Type-check admin
        if: needs.changes.outputs.admin == 'true'
        run: pnpm --filter admin exec tsc --noEmit

      - name: Type-check frontend
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm --filter frontend exec tsc --noEmit

      # Deliberately no `next build` here, same reasoning as the backend's
      # build-check job skipping a live-DB migration replay: several pages
      # fetch from BACKEND_API_URL during static generation, which this
      # ubuntu-latest runner has no route to. tsc --noEmit already catches
      # type errors across both apps and shared/ without needing live infra;
      # the real production build (with real backend connectivity) happens
      # in the deploy job below, on the self-hosted runner.

  # Trigger matrix:
  #  - push to main   -> deploy-prod AND deploy-test (main is the shared
  #                      integration branch; both environments track it)
  #  - push to prod   -> deploy-prod only (a dedicated branch for pushing
  #                      straight to production without going through main)
  #  - push to testing -> deploy-test only
  # Both jobs run on the same self-hosted runner/VPS and only ever touch
  # the PM2 apps in their own name (and, for deploy-test, its own
  # testing-deploy/ checkout subfolder — see below), so a bad push to
  # testing/prod can't take down the other side (see AGENTS.md — this
  # mirrors the backend's own prod/test split).
  deploy-prod:
    needs: [changes, build-check]
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod') &&
      github.event_name == 'push' &&
      (needs.changes.outputs.admin == 'true' || needs.changes.outputs.frontend == 'true')
    # Runs directly on your VPS via the self-hosted runner registered there
    # (server path: actions-runner/) — no SSH-in step, no secrets required.
    # The runner IS the deploy target, same as the backend's deploy job.
    runs-on: self-hosted
    steps:
      # The runner checks out the latest main into its own workspace
      # automatically — no manual git pull/cd to a separate path needed.
      # clean: false — actions/checkout's default (clean: true) runs
      # `git clean -ffdx` before checking out, which wipes every untracked
      # file in the workspace: .env files, logs/, .next/ build output, all
      # of it. On a self-hosted runner this workspace IS the live deploy
      # folder, not a throwaway CI sandbox, so that default deletes real
      # server state (e.g. frontend/.env.production, admin/.env) on every
      # single deploy. clean: false still updates any tracked file that
      # changed, it just stops nuking everything else alongside it.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        if: needs.changes.outputs.admin == 'true'
        run: pnpm run build:admin

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        run: pnpm run build:frontend

      - name: Restart admin via PM2
        if: needs.changes.outputs.admin == 'true'
        run: |
          set -e
          mkdir -p logs
          pm2 startOrReload ecosystem.config.js --only deep-ecom-admin-prod --update-env
          pm2 save

      - name: Restart frontend via PM2
        if: needs.changes.outputs.frontend == 'true'
        run: |
          set -e
          mkdir -p logs
          pm2 startOrReload ecosystem.config.js --only deep-ecom-frontend-prod --update-env
          pm2 save

  deploy-test:
    needs: [changes, build-check]
    if: |
      (github.ref == 'refs/heads/testing' || github.ref == 'refs/heads/main') &&
      github.event_name == 'push' &&
      (needs.changes.outputs.admin == 'true' || needs.changes.outputs.frontend == 'true')
    # Same self-hosted runner/VPS as deploy-prod, but checked out into its
    # own subfolder (path: testing-deploy) rather than the runner's default
    # $GITHUB_WORKSPACE. Without this, deploy-prod and deploy-test would
    # both check out into the exact same directory on disk — a push to
    # `testing` would overwrite admin/.next and frontend/.next (the prod
    # build output) that the still-running deep-ecom-*-prod PM2 processes
    # read from, corrupting production. This gives testing its own
    # completely separate copy of the repo (its own admin/, frontend/,
    # ecosystem.config.js) that deploy-prod's directory never touches.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          path: testing-deploy
          clean: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: testing-deploy/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: testing-deploy
        run: pnpm install --frozen-lockfile

      - name: Build admin
        if: needs.changes.outputs.admin == 'true'
        working-directory: testing-deploy
        run: pnpm run build:admin

      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        working-directory: testing-deploy
        run: pnpm run build:frontend

      - name: Restart admin via PM2
        if: needs.changes.outputs.admin == 'true'
        working-directory: testing-deploy
        run: |
          set -e
          mkdir -p logs
          pm2 startOrReload ecosystem.config.js --only deep-ecom-admin-test --update-env
          pm2 save

      - name: Restart frontend via PM2
        if: needs.changes.outputs.frontend == 'true'
        working-directory: testing-deploy
        run: |
          set -e
          mkdir -p logs
          pm2 startOrReload ecosystem.config.js --only deep-ecom-frontend-test --update-env
          pm2 save
